name: Deploy to cPanel (FTPS)

# Deploys public/ to the letsgetfit.site document root over encrypted FTP.
#  - Automatically after the CI workflow passes on a push to main (only tested commits go live).
#  - Manually from Actions > "Deploy to cPanel (FTPS)" > Run workflow, optionally choosing an
#    older commit to roll back, or a dry run.
# Secrets used: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (or FTP_DIRECTORY);
# optional FDC_API_KEY (food search) and APP_HASH_SECRET.
# Optional repository variables: FTP_CERT_FINGERPRINT, FTP_PORT, FTP_VERIFY_CERT, SITE_URL.
# See docs/DEPLOY-CPANEL.md. To pause deployments, disable this workflow in the Actions tab.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to deploy. Use an older commit SHA to roll back.
        required: false
        default: main
      dry_run:
        description: Only list what would be uploaded; change nothing on the server.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to cPanel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://letsgetfit.site/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # After CI: deploy exactly the commit CI tested. Manual run: the chosen ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          tools: composer:v2
          coverage: none

      # Composer may not exist on the host, so packages are built here and uploaded.
      - name: Composer packages for the server (PHPMailer)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --working-dir=server

      - name: Quick checks before upload
        run: |
          node --test "tests/unit/*.test.mjs"
          node scripts/check-static.mjs
          node scripts/php-lint.mjs
          php tests/php/run.php

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload public/ over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Accepts either secret name; FTP_DIR is the one saved in this repository.
          FTP_DIRECTORY: ${{ secrets.FTP_DIRECTORY || secrets.FTP_DIR }}
          # The host's FTP service uses a self-signed certificate. Trust exactly that one
          # certificate (seen on 9 Nov 2026). If the host replaces it, the deploy stops safely and
          # prints the new fingerprint: check it, then set the FTP_CERT_FINGERPRINT variable.
          FTP_CERT_FINGERPRINT: ${{ vars.FTP_CERT_FINGERPRINT || '5A:56:57:A6:A1:AD:1B:04:39:30:8C:5B:1C:49:B7:98:1A:EB:55:5F' }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          # Food search: written to the private settings file outside the web root.
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
          APP_HASH_SECRET: ${{ secrets.APP_HASH_SECRET }}
          # AI meal scan (Phase 5): on only when OPENAI_API_KEY is set.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SCAN_DAILY_LIMIT: ${{ vars.SCAN_DAILY_LIMIT }}
          # Optional accounts (Phase 4): OFF unless the ACCOUNTS_ENABLED variable is 'true' and
          # every database and email secret below is set. See docs/DATABASE.md and docs/PRIVACY.md.
          ACCOUNTS_ENABLED: ${{ vars.ACCOUNTS_ENABLED }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          # Whoever logs in with a code sent to ADMIN_EMAIL becomes the admin. ADMIN_SETUP_TOKEN
          # (24+ random characters) creates the database tables from https://letsgetfit.site/#admin.
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          # Used to prove which FTP folder is the live site's document root.
          SITE_URL: ${{ vars.SITE_URL || 'https://letsgetfit.site/' }}
        run: bash scripts/deploy-ftp.sh

      - name: Check the live site
        if: ${{ !inputs.dry_run }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://letsgetfit.site/' }}
        run: |
          echo "Deployed commit: $(git rev-parse --short=12 HEAD)"
          if body="$(curl --fail --silent --show-error --location --max-time 20 "$SITE_URL")" && grep -q '<title>LetsGetFit</title>' <<<"$body"; then
            echo "Live check passed: $SITE_URL returns the LetsGetFit page."
          else
            echo "::warning::Files were uploaded, but $SITE_URL did not return the LetsGetFit page. DNS, HTTPS or the document root may not be set up yet. See docs/DEPLOY-CPANEL.md."
          fi
          # Server check: PHP version, extensions and food search status (no secrets in the reply).
          health="$(curl --silent --location --max-time 20 "${SITE_URL%/}/api/health.php" || true)"
          echo "Server health: $health"
          if ! grep -q '"ok":true' <<<"$health"; then
            echo "::warning::$SITE_URL/api/health.php did not answer OK. Food search will be unavailable (manual entry still works). See 'Server code for food search' in docs/DEPLOY-CPANEL.md."
          fi
          if grep -q '"accounts":"enabled"' <<<"$health"; then
            echo "::notice::Accounts are switched ON. If this is the first time, open ${SITE_URL%/}/#admin and enter the ADMIN_SETUP_TOKEN to create the database tables."
          fi
          if grep -q '"aiScan":"enabled"' <<<"$health"; then
            echo "::notice::AI meal scan is switched ON."
          elif grep -q '"aiScan":"unavailable"' <<<"$health"; then
            echo "::warning::An OpenAI key is set but the server cannot process images (the PHP GD extension may be missing). Photo scanning stays hidden."
          fi
          if grep -q '"accounts":"enabled"' <<<"$health"; then
            echo "::notice::Accounts are switched ON. Make sure migrations have been run (docs/DATABASE.md)."
          fi
          if grep -q '"foodSearch":"demo-key"' <<<"$health"; then
            echo "::warning::Food search is using the public DEMO_KEY. Add an FDC_API_KEY repository secret for normal use."
          fi
          # One real search proves PHP can reach FoodData Central over HTTPS (results are cached).
          search="$(curl --silent --location --max-time 25 "${SITE_URL%/}/api/foods.php?q=apple" || true)"
          if grep -q '"results":\[{' <<<"$search"; then
            echo "Live search check passed: /api/foods.php?q=apple returned results$(grep -q '"cached":true' <<<"$search" && echo ' (from cache)')."
          else
            echo "Live search reply: $(head -c 300 <<<"$search")"
            echo "::warning::A live food search did not return results. If it says not_configured or upstream_unavailable, outbound HTTPS from PHP may be blocked or the key is invalid. Manual entry still works."
          fi
